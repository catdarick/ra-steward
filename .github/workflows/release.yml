name: Release

on:
  push:
    tags: ['v*']
  # Retry by selecting the same version tag in the Run workflow menu.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/release.mjs

  checks:
    needs: validate
    uses: ./.github/workflows/check.yml
    secrets: inherit

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Publish the tested archive to npm and GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs
