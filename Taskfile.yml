version: '3'

vars:
  PORT: '{{.PORT | default "8080"}}'
  UI_PORT: '{{.UI_PORT | default "5174"}}'

env:
  PORT: '{{.PORT}}'
  UI_PORT: '{{.UI_PORT}}'

tasks:
  default:
    desc: List the commands
    cmds:
      - task --list

  install:
    desc: Install the frontend's packages
    sources: [package.json, packages/ra-steward/package.json, demo/package.json, package-lock.json]
    cmds:
      - npm ci

  lock:
    desc: Update the package lock after changing dependencies
    cmds:
      - npm install --package-lock-only --ignore-scripts {{.CLI_ARGS}}

  dev:
    desc: Run the demo against STEWARD_URL (or localhost on PORT)
    deps: [build:library]
    cmds:
      - npm run dev

  build:
    desc: Build the library (JS and types) and production demo
    deps: [install]
    cmds:
      - npm run build

  build:library:
    desc: Build the distributable library into packages/ra-steward/dist
    deps: [install]
    cmds:
      - npm run build:library

  typecheck:
    desc: Typecheck the frontend
    deps: [build:library]
    cmds:
      - npm run typecheck

  test:
    desc: Run the frontend's unit tests
    deps: [install]
    cmds:
      - npm test
      - npm run test:release

  test:contract:
    desc: Check responses generated by steward (STEWARD_CONTRACT_FILE)
    deps: [install]
    preconditions:
      - sh: test -n "$STEWARD_CONTRACT_FILE" && test -f "$STEWARD_CONTRACT_FILE"
        msg: Set STEWARD_CONTRACT_FILE to a file generated by steward's protocol:fixtures task.
    cmds:
      - npm test -- packages/ra-steward/src/protocol.contract.test.ts

  test:package:
    desc: Pack and install the library into a separate React Admin app, typecheck and build it
    deps: [install]
    cmds:
      - npm run test:package -- {{.CLI_ARGS}}

  pack:
    desc: Build a publishable npm archive in artifacts
    deps: [install]
    cmds:
      - mkdir -p artifacts
      - npm run pack -- {{.CLI_ARGS}}

  version:
    desc: Set the library version and refresh the lockfile (VERSION=0.2.0)
    requires:
      vars: [VERSION]
    deps: [install]
    cmds:
      - npm version "{{.VERSION}}" --workspace ra-steward --no-git-tag-version
      - npm install --package-lock-only --ignore-scripts

  release:check:
    desc: Validate the release tag and publication metadata (RELEASE_TAG=v0.1.0)
    deps: [install]
    cmds:
      - npm run release:check

  e2e:
    desc: Run the browser tests against the example backend (STEWARD_DIR starts it)
    deps: [build:library]
    cmds:
      - npx playwright install chromium
      - npm run e2e -- {{.CLI_ARGS}}

  e2e:list:
    desc: List browser tests without downloading or starting a browser
    deps: [install]
    cmds:
      - npm run e2e -- --list

  check:
    desc: Typecheck, test, build and verify the installed npm package
    cmds:
      - task: typecheck
      - task: test
      - task: build
      - task: test:package

  icons:
    desc: Regenerate the icon loaders from scripts/mui-icons.txt
    cmds:
      - npm run icons
